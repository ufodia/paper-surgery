name: Bug report
description: Report a reproducible problem in Paper Surgery.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a synthetic or redacted sample. Never attach private conversations or documents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and commit
